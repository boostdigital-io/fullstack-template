# Alleen voor lokaal. Geen echte secrets: database, gebruiker en wachtwoord zijn de projectnaam.
# Een vaste `name` zorgt dat elke worktree dezelfde container en hetzelfde volume gebruikt.
name: fullstack_template

x-project: &project fullstack_template

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: *project
      POSTGRES_USER: *project
      POSTGRES_PASSWORD: *project
    ports:
      - "5432:5432"
    volumes:
      # Vanaf Postgres 18 staat de data onder /var/lib/postgresql, niet meer in .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullstack_template -d fullstack_template"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
